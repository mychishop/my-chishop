<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าของฉัน - สินค้าทั้งหมด</title>
  
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #f8f9fa; margin: 0; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #333; margin-bottom: 5px; }
    .header p { color: #666; margin-top: 0; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
    .product-img { width: 100%; height: 230px; object-fit: cover; background-color: #eee; }
    .product-info { padding: 18px; }
    .product-title { font-size: 1.15rem; font-weight: bold; margin: 0 0 8px 0; color: #222; }
    .product-price { color: #e63946; font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; }
    .product-desc { color: #6c757d; font-size: 0.9rem; margin-bottom: 18px; min-height: 40px; line-height: 1.4; }
    .line-btn {
      display: block;
      width: 100%;
      background-color: #06C755;
      color: white;
      text-align: center;
      padding: 12px 0;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
    }
    .line-btn:hover { background-color: #05b34c; }
    .loading { text-align: center; font-size: 1.2rem; color: #666; padding: 50px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>แคตตาล็อกสินค้า</h1>
    <p>เลือกชมสินค้า และกดสั่งซื้อผ่าน LINE ได้ทันที</p>
  </div>

  <div id="loading" class="loading">กำลังโหลดรายการสินค้า...</div>
  <div id="product-list" class="product-grid"></div>

  <script>
    // *** นำ Web App URL ที่ได้จาก Apps Script มาวางแทนที่ข้อความตรงนี้ ***
    const API_URL = "https://script.google.com/macros/s/AKfycbz0hzLZ9nMyh7erc0F0mKgL_aDHN6_HBBew5JM2gfcxeHiZQIWvPAX-5ukkhEmLS7zb/exec";

    async function fetchProducts() {
      try {
        const response = await fetch(API_URL);
        const products = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('product-list');

        if (products.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">ยังไม่มีรายการสินค้าในขณะนี้</p>';
          return;
        }

        products.forEach(item => {
          // หากไม่มีรูปภาพ ให้แสดงรูปตัวอย่างชั่วคราว
          const imageUrl = item.image_url ? item.image_url : 'https://via.placeholder.com/400x400?text=No+Image';

          // ข้อความอัตโนมัติเมื่อลูกค้ากดเข้าไลน์
          const encodedMsg = encodeURIComponent(`สวัสดีครับ/ค่ะ สนใจสั่งซื้อสินค้า: ${item.name} (รหัส: ${item.id}) ราคา ${item.price} บาท`);
          const lineUrlWithMsg = `${item.line_link}?text=${encodedMsg}`;

          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img class="product-img" src="${imageUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/400x400?text=Image+Error'">
            <div class="product-info">
              <h3 class="product-title">${item.name}</h3>
              <div class="product-price">฿${Number(item.price).toLocaleString()}</div>
              <p class="product-desc">${item.description || ''}</p>
              <a href="${lineUrlWithMsg}" target="_blank" class="line-btn">
                สั่งซื้อผ่าน LINE
              </a>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("Error loading products:", error);
        document.getElementById('loading').innerText = "เกิดข้อผิดพลาดในการดึงข้อมูลสินค้า";
      }
    }

    fetchProducts();
  </script>
</body>
</html>
