<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYCHISHOP - แคตตาล็อกสินค้าออนไลน์</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Global site tag (gtag.js) - Google Analytics (GA4) -->
  <!-- *** นำ GA4 Measurement ID เช่น G-XXXXXXXXXX มาใส่แทนตรงนี้ *** -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <style>
    :root {
      --primary-color: #06C755;
      --primary-hover: #05b34c;
      --dark-color: #1a1a1a;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-muted: #6c757d;
      --border-radius: 12px;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--dark-color); line-height: 1.6; }

    /* Header & Hero Section */
    .hero {
      background: linear-gradient(135deg, #06C755 0%, #009933 100%);
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .hero h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
    .hero p { font-size: 1.05rem; opacity: 0.9; }

    /* Container */
    .container { max-width: 1200px; margin: -25px auto 40px auto; padding: 0 20px; }

    /* Search & Filter Bar */
    .control-panel {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--primary-color); }
    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }

    .stats { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }

    /* Product Grid UI */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    /* Product Card UI */
    .product-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      background-color: #e9ecef;
      overflow: hidden;
    }
    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .product-img { transform: scale(1.04); }

    /* Status Badge */
    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .status-active { background-color: #28a745; color: white; }
    .status-out { background-color: #dc3545; color: white; }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-code { font-size: 0.8rem; color: #888; font-weight: 500; margin-bottom: 4px; }
    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .product-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 15px;
    }
    .product-price {
      font-size: 1.35rem;
      font-weight: 700;
      color: #e63946;
    }

    /* LINE Order Button UI */
    .line-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      padding: 12px 0;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }
    .line-btn:hover { background-color: var(--primary-hover); }
    .line-btn.disabled {
      background-color: #ccc;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Loading & Empty State */
    .loading-container {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .spinner {
      border: 4px solid rgba(0,0,0,0.1);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 0.85rem;
      border-top: 1px solid #e0e0e0;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <!-- Hero Banner Header -->
  <div class="hero">
    <h1><i class="fa-solid fa-store"></i> MYCHISHOP</h1>
    <p>แคตตาล็อกสินค้าออนไลน์ เลือกชมและสั่งซื้อสะดวกผ่าน LINE ได้ทันที</p>
  </div>

  <div class="container">
    <!-- Control Panel (Search Bar & Stats) -->
    <div class="control-panel">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อสินค้า หรือรหัสสินค้า..." onkeyup="filterProducts()">
      </div>
      <div class="stats" id="productStats">กำลังโหลดรายการสินค้า...</div>
    </div>

    <!-- Product Grid Content -->
    <div id="productList" class="product-grid">
      <div class="loading-container">
        <div class="spinner"></div>
        <p>กำลังดึงข้อมูลสินค้าล่าสุด...</p>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 MYCHISHOP. All rights reserved. | Dynamic Product Catalog
  </footer>

  <script>
    // *** API URL จาก Google Apps Script (ตรวจสอบให้ลงท้ายด้วย /exec) ***
    const API_URL = "https://script.google.com/macros/s/AKfycbxxxx.../exec"; 

    let allProducts = [];

    async function fetchProducts() {
      const container = document.getElementById('productList');
      const stats = document.getElementById('productStats');

      try {
        const response = await fetch(API_URL);
        allProducts = await response.json();

        if (!Array.isArray(allProducts) || allProducts.length === 0) {
          container.innerHTML = `
            <div class="loading-container">
              <i class="fa-solid fa-box-open" style="font-size: 3rem; color: #ccc; margin-bottom: 10px;"></i>
              <p>ขณะนี้ยังไม่มีรายการสินค้าในระบบ</p>
            </div>`;
          stats.innerText = "พบสินค้า 0 รายการ";
          return;
        }

        renderProducts(allProducts);

      } catch (error) {
        console.error("Fetch Error:", error);
        container.innerHTML = `
          <div class="loading-container">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #e63946; margin-bottom: 10px;"></i>
            <p style="color: #e63946; font-weight: 600;">เกิดข้อผิดพลาดในการดึงข้อมูลสินค้า</p>
            <p style="font-size: 0.85rem; color: #888;">โปรดตรวจสอบชื่อ Sheet "Products" และการ Deploy API แบบ Anyone</p>
          </div>`;
        stats.innerText = "เกิดข้อผิดพลาด";
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('productList');
      const stats = document.getElementById('productStats');
      container.innerHTML = "";

      stats.innerText = `แสดงสินค้า ${products.length} รายการ`;

      if (products.length === 0) {
        container.innerHTML = `
          <div class="loading-container">
            <p>ไม่พบสินค้าที่ตรงกับการค้นหา</p>
          </div>`;
        return;
      }

      products.forEach(item => {
        const isActive = (item.status && item.status.toString().toLowerCase() === 'active');
        const imageUrl = item.image_url ? item.image_url : 'https://via.placeholder.com/400x400?text=No+Image';

        // สร้างข้อความสั่งซื้ออัตโนมัติเมื่อกดคลิกเข้า LINE
        const orderMsg = encodeURIComponent(`สวัสดีครับ/ค่ะ สนใจสั่งซื้อสินค้า: ${item.name} (รหัส: ${item.id}) ราคา ฿${item.price}`);
        const lineTargetUrl = item.line_link ? `${item.line_link}?text=${orderMsg}` : '#';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="img-wrapper">
            <img class="product-img" src="${imageUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/400x400?text=Image+Error'">
            <span class="status-badge ${isActive ? 'status-active' : 'status-out'}">
              ${isActive ? 'พร้อมส่ง' : 'สินค้าหมด'}
            </span>
          </div>
          <div class="product-info">
            <div class="product-code">รหัสสินค้า: ${item.id || '-'}</div>
            <h3 class="product-title">${item.name}</h3>
            <p class="product-desc">${item.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
            <div class="product-price-row">
              <span class="product-price">฿${Number(item.price || 0).toLocaleString()}</span>
            </div>
            <a href="${lineTargetUrl}" 
               target="_blank" 
               class="line-btn ${isActive ? '' : 'disabled'}"
               onclick="trackLineClick('${item.id}', '${item.name}')">
              <i class="fa-brands fa-line" style="font-size: 1.2rem;"></i> 
              ${isActive ? 'สั่งซื้อผ่าน LINE' : 'สินค้าหมดชั่วคราว'}
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ระบบค้นหา คัดกรองสินค้าตามคีย์เวิร์ด */
    function filterProducts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allProducts.filter(item => {
        const nameMatch = item.name ? item.name.toLowerCase().includes(keyword) : false;
        const idMatch = item.id ? item.id.toLowerCase().includes(keyword) : false;
        return nameMatch || idMatch;
      });
      renderProducts(filtered);
    }

    /* Google Analytics 4 Event Tracking สำหรับการกดปุ่มสั่งซื้อ */
    function trackLineClick(productId, productName) {
      if (typeof gtag === 'function') {
        gtag('event', 'click_line_order', {
          'product_id': productId,
          'product_name': productName
        });
      }
    }

    // เรียกโหลดข้อมูลเมื่อเปิดหน้าเว็บ
    fetchProducts();
  </script>
</body>
</html>
