<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYCHISHOP - Link & Catalog</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #f7f3f0;
      --pink-card: #f8c8d8;
      --pink-hover: #f5b3c7;
      --text-color: #4a3e3d;
      --white: #ffffff;
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .bio-container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile Header */
    .profile-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 12px;
      border: 2px solid var(--white);
    }
    .profile-logo i { font-size: 2.5rem; color: #e799b0; }

    .username {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-color);
    }

    /* Link Buttons */
    .link-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--pink-card);
      color: var(--text-color);
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .link-btn:hover {
      background-color: var(--pink-hover);
      transform: translateY(-2px);
    }

    .link-btn .btn-icon {
      width: 32px;
      height: 32px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .link-btn.line .btn-icon { color: #06C755; }
    .link-btn.catalog .btn-icon { color: #e799b0; }

    /* Product Section (Catalog Drawer) */
    .catalog-section {
      width: 100%;
      background: var(--white);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      margin-top: 10px;
    }

    .catalog-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .product-card {
      background: #faf7f5;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      text-align: left;
      border: 1px solid #f0ece9;
    }

    .product-img {
      width: 90px;
      height: 90px;
      object-fit: cover;
    }

    .product-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 0.9rem;
      color: #d8708d;
      font-weight: 600;
    }

    .order-mini-btn {
      align-self: flex-end;
      background: #06C755;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-decoration: none;
      margin-top: 4px;
    }

    /* Secret Admin Entry Footer */
    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #bbb;
    }

    .secret-admin {
      color: #bbb;
      text-decoration: none;
      font-size: 0.8rem;
      transition: color 0.2s;
    }

    .secret-admin:hover {
      color: #888;
    }
  </style>
</head>
<body>

  <div class="bio-container">
    <!-- Profile Header -->
    <div class="profile-logo">
      <i class="fa-solid fa-shirt"></i>
    </div>
    <div class="username">@mychishop</div>

    <!-- Main Link Buttons -->
    <div class="link-list">
      <a href="#catalogArea" class="link-btn catalog">
        <div class="btn-icon"><i class="fa-solid fa-bag-shopping"></i></div>
        <span>รวม ชุดในร้าน</span>
        <i class="fa-solid fa-ellipsis-vertical" style="opacity: 0.3;"></i>
      </a>

      <a href="https://line.me/ti/p/~your_line_id" target="_blank" class="link-btn line">
        <div class="btn-icon"><i class="fa-brands fa-line"></i></div>
        <span>สอบถาม / จองคิว</span>
        <i class="fa-solid fa-ellipsis-vertical" style="opacity: 0.3;"></i>
      </a>
    </div>

    <!-- Catalog Section -->
    <div class="catalog-section" id="catalogArea">
      <div class="catalog-title">
        <i class="fa-solid fa-sparkles"></i> รายการสินค้าแนะนำ
      </div>

      <div id="productList" class="product-grid">
        <p style="color: #999; font-size: 0.85rem;">กำลังโหลดสินค้า...</p>
      </div>
    </div>

    <!-- Footer พร้อมปุ่มลับแอดมิน 🔒 -->
    <footer>
      <p>© 2026 MYCHISHOP</p>
      <a href="admin.html" class="secret-admin" title="สำหรับแอดมิน"><i class="fa-solid fa-lock"></i> Admin Log-in</a>
    </footer>
  </div>

  <script>
    // *** อย่าลืมวาง Web App URL ของ Google Apps Script ตรงนี้ ***
    const API_URL = "https://script.google.com/macros/s/AKfycb.../exec";

    async function loadProducts() {
      const container = document.getElementById('productList');
      try {
        const response = await fetch(API_URL);
        const products = await response.json();

        if (!Array.isArray(products) || products.length === 0) {
          container.innerHTML = '<p style="color: #999; font-size: 0.85rem;">ยังไม่มีรายการสินค้า</p>';
          return;
        }

        container.innerHTML = "";
        products.forEach(item => {
          const isActive = (item.status && item.status.toString().toLowerCase() === 'active');
          const img = item.image_url || 'https://via.placeholder.com/150';
          const orderMsg = encodeURIComponent(`สวัสดีค่ะ สนใจสั่งซื้อสินค้า: ${item.name} (รหัส: ${item.id})`);
          const lineLink = item.line_link ? `${item.line_link}?text=${orderMsg}` : '#';

          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img class="product-img" src="${img}" alt="${item.name}">
            <div class="product-info">
              <div class="product-name">${item.name}</div>
              <div class="product-price">฿${Number(item.price).toLocaleString()}</div>
              ${isActive 
                ? `<a href="${lineLink}" target="_blank" class="order-mini-btn"><i class="fa-brands fa-line"></i> สั่งซื้อ</a>`
                : `<span style="font-size:0.75rem; color:#aaa;">หมดชั่วคราว</span>`
              }
            </div>
          `;
          container.appendChild(card);
        });

      } catch (e) {
        container.innerHTML = '<p style="color: #e63946; font-size: 0.85rem;">โหลดสินค้าไม่สำเร็จ</p>';
      }
    }

    loadProducts();
  </script>

</body>
</html>
